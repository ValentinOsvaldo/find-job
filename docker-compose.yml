# docker compose up --build  →  http://localhost:8080
services:
  vacantes:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      EVERY_HOURS: ${EVERY_HOURS:-6}
      # SEARCH_TERMS: auxiliar administrativo,capturista
      # LOCATION: Monterrey, Nuevo León
    volumes:
      - ./web/public/data:/app/public/data
